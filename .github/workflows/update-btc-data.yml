name: Update BTC dashboard data

on:
  # Retired 2026-11-03: no page reads data.json since the v2 observatory (data/observatory.json),
  # and no other consumer was found. The schedule is off (it also spent DeepSeek/FRED quota);
  # manual dispatch remains so the snapshot can be regenerated if something turns out to need it.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-btc-data:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
      FRED_KEY: ${{ secrets.FRED_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install scraper dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Fetch BTC dashboard snapshot
        run: python scripts/fetch_data.py
      - name: Commit BTC data if changed
        run: |
          bash scripts/commit_generated.sh "chore: update BTC dashboard data" data.json
