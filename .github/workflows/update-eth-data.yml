name: Update ETH on-chain data

on:
  workflow_dispatch:
  schedule:
    # Daily refresh. ETH page reads the committed eth-data.json file.
    - cron: '20 0 * * *'

permissions:
  contents: write

jobs:
  update-eth-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Fetch ETH on-chain snapshot
        run: python scripts/fetch_eth_data.py
      - name: Commit ETH data if changed
        run: |
          bash scripts/commit_generated.sh "chore: update ETH on-chain data" eth-data.json
