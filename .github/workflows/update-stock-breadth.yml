name: Update stock breadth snapshot

on:
  workflow_dispatch:
  schedule:
    # After US market close; daily on weekdays.
    - cron: '30 22 * * 1-5'

permissions:
  contents: write

jobs:
  update-stock-breadth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build breadth snapshot
        run: python scripts/build_stock_breadth_snapshot.py
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/market-breadth-latest.json
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "chore: update stock breadth snapshot"
          # Another data workflow may land first; rebase and retry instead of failing.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected on attempt $attempt, rebasing onto latest master"
            git pull --rebase origin master
          done
          echo "Push still failing after 3 attempts"
          exit 1
