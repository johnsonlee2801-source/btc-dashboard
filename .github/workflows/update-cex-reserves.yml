name: Update CEX reserves

on:
  workflow_dispatch:
  schedule:
    # Daily. DefiLlama refreshes CEX balances once a day; the page reads data/cex-reserves.json.
    - cron: '40 1 * * *'

permissions:
  contents: write

jobs:
  update-cex-reserves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Fetch CEX BTC/ETH reserves
        run: python scripts/fetch_cex_reserves.py
      - name: Commit reserves if changed
        run: |
          bash scripts/commit_generated.sh "chore: update CEX reserves" data/cex-reserves.json
