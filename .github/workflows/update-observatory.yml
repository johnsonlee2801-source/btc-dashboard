name: Update BTC and ETH observatory

on:
  workflow_dispatch:
  schedule:
    # Daily observations plus fresher derivatives. The collector caches the
    # optional chain source for 24h to keep its daily free request allowance.
    - cron: '20 2,8,14,20 * * *'

permissions:
  contents: write

concurrency:
  group: observatory-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify public-data calculations
        run: |
          python -B -m unittest discover -s tests -p 'test_observatory*.py' -q
          python -B -m unittest discover -s tests -p 'test_new_pipelines.py' -q
          python -B -m unittest discover -s tests -p 'test_checkonchain.py' -q
      - name: Collect public BTC and ETH observations
        env:
          # fapi.binance.com returns HTTP 451 to US runners; the site's Singapore function relays it.
          BINANCE_PROXY_URL: https://btc.flowhunt.net/api/binance-futures
          BINANCE_PROXY_TOKEN: ${{ secrets.RELAY_TOKEN }}
        run: python -B scripts/build_observatory.py
      - name: Rebuild halving-cycle history
        # Optional input for /halving; a Coin Metrics outage must not block the observatory snapshot.
        continue-on-error: true
        run: python -B scripts/build_halving.py
      - name: Add new days of spot flow by trade size
        # Binance publishes each UTC day's aggTrades dump a few hours later; missing days are retried next run.
        continue-on-error: true
        run: python -B scripts/build_spot_flow.py
      - name: Commit snapshot if changed
        run: |
          bash scripts/commit_generated.sh "chore: update BTC and ETH observatory" data/observatory.json data/onchain-history.json data/halving-cycles.json data/spot-flow.json
