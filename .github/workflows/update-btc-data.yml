name: Update BTC dashboard data

on:
  workflow_dispatch:
  schedule:
    # Refresh the committed BTC snapshot every 6 hours.
    - cron: '15 */6 * * *'

permissions:
  contents: write

jobs:
  update-btc-data:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
      FRED_KEY: ${{ secrets.FRED_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install scraper dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Fetch BTC dashboard snapshot
        run: python scripts/fetch_data.py
      - name: Commit BTC data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No BTC data changes"
          else
            git commit -m "chore: update BTC dashboard data"
            git push
          fi
