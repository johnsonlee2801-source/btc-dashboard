name: Update ETH on-chain data

on:
  workflow_dispatch:
  schedule:
    # Daily refresh. ETH page reads the committed eth-data.json file.
    - cron: '20 0 * * *'

permissions:
  contents: write

jobs:
  update-eth-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch ETH on-chain snapshot
        run: python scripts/fetch_eth_data.py
      - name: Commit ETH data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eth-data.json
          if git diff --cached --quiet; then
            echo "No ETH data changes"
          else
            git commit -m "chore: update ETH on-chain data"
            git push
          fi
