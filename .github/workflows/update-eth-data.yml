name: Update ETH on-chain data

on:
  workflow_dispatch:
  schedule:
    # Daily refresh. ETH page reads the committed eth-data.json file.
    - cron: '20 0 * * *'

permissions:
  contents: write

jobs:
  update-eth-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Fetch ETH on-chain snapshot
        run: python scripts/fetch_eth_data.py
      - name: Commit ETH data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eth-data.json
          if git diff --cached --quiet; then
            echo "No ETH data changes"
            exit 0
          fi
          git commit -m "chore: update ETH on-chain data"
          # Another data workflow may land first; rebase and retry instead of failing.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected on attempt $attempt, rebasing onto latest master"
            git pull --rebase origin master
          done
          echo "Push still failing after 3 attempts"
          exit 1
